name: Train Model with MLflow Project

on:
  push:
    paths:
      - 'MLProject/**'
      - '.github/workflows/train.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas numpy scikit-learn matplotlib joblib

      - name: Run MLflow Project
        run: |
          mlflow run MLProject -P data_dir=namadataset_preprocessing -P target_col=target

      - name: Collect artifacts
        run: |
          mkdir -p training-artifacts
          cp -r mlruns training-artifacts/mlruns || true
          find . -maxdepth 4 -type d -name artifacts -exec cp -r {} training-artifacts/ \; || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-training-artifacts
          path: training-artifacts

      - name: Commit artifacts to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add training-artifacts
          git commit -m "Add training artifacts" || echo "No artifact changes"
          git push || true
